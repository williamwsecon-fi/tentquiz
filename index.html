<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tentquiz</title>
<meta name="description" content="Öva inför tentan med AI-frågor byggda på ditt eget kursmaterial.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D4FA8'/%3E%3Cpath d='M18 22h28M18 32h20M18 42h24' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: en smal kolumn, ett kort per steg – fungerar lika bra på telefon som dator */
:root{
  color-scheme:light;
  --bg:#EDF1F6; --surface:#FFFFFF; --fg:#13202F; --muted:#5A6878; --line:#D3DBE6;
  --accent:#1D4FA8; --accent-ink:#FFFFFF; --sel-bg:#DCE6F7; --chip:#E3E9F2;
  --good:#1D7448; --good-bg:#E3F3EA; --bad:#B42318; --bad-bg:#FBE9E7; --warn:#8A5A00; --warn-bg:#FFF3D6; --skip-bg:#E8ECF2;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E151F; --surface:#17212E; --fg:#E6ECF3; --muted:#9AA8B8; --line:#2A3748;
  --accent:#7FA7F0; --accent-ink:#0E151F; --sel-bg:#1E3050; --chip:#223044;
  --good:#6FD39C; --good-bg:#14301F; --bad:#FF8A7E; --bad-bg:#3A1A17; --warn:#F2C46B; --warn-bg:#3A2E12; --skip-bg:#222D3B; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}
h1{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.3;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.score{font-family:var(--display);font-weight:800;font-size:1.5rem}
.tally{display:flex;gap:10px;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:11px 16px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.link{font:inherit;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.link.muted{color:var(--muted)}
.link:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible,.chip:focus-visible,.gq:focus-visible,.course:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{font-weight:600;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical;line-height:1.45}
textarea.answer{min-height:160px} textarea.essay{min-height:280px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.part{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end;padding-bottom:10px;border-bottom:1px solid var(--line)}
.part label{font-size:.8rem;font-weight:600;color:var(--muted)}
.part .x{align-self:end;margin-bottom:6px}
@media (max-width:520px){.part{grid-template-columns:repeat(3,minmax(0,1fr)) auto}.part .ptype{grid-column:1/-1}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.92rem;border-radius:999px;padding:7px 13px;border:1.5px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--sel-bg);font-weight:600}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg);border-radius:8px;min-width:0}
.files .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;color:var(--fg);text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--display);font-weight:800;color:var(--muted);min-width:1.1em}
.opt.sel{border-color:var(--accent);background:var(--sel-bg)} .opt.sel .k{color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.right .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{color:var(--bad)}
.opt.dim{opacity:.55}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:700}
.fb{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-bg)} .fb.bad{background:var(--bad-bg)} .fb.skip{background:var(--skip-bg)} .fb.part{background:var(--warn-bg)}
.fb strong{font-family:var(--display)}
.fb.good strong{color:var(--good)} .fb.bad strong{color:var(--bad)} .fb.part strong{color:var(--warn)}
.fb ul{margin:0;padding-left:1.2em}
.notice{border-radius:10px;padding:12px 14px;background:var(--warn-bg);color:var(--fg)}
.notice.err{background:var(--bad-bg)}
.notice.ok{background:var(--good-bg)}
.big{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.grade{font-family:var(--display);font-weight:800;font-size:1.3rem}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.gq{font:inherit;font-size:.8rem;font-variant-numeric:tabular-nums;padding:7px 0;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.gq.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gq.cur{outline:2px solid var(--fg);outline-offset:1px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.list li{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.list .a{color:var(--good);font-weight:600} .list .y{color:var(--bad);font-weight:600} .list .x{color:var(--muted);font-size:.92rem}
.course{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;width:100%}
.course:hover{border-color:var(--accent)}
.course .t{font-family:var(--display);font-weight:600;font-size:1.2rem}
.pill{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:.74rem;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.on{background:var(--sel-bg);color:var(--accent)}
.mrow{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1 1 auto}
.mrow .nm{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.mrow .link{text-align:left}
.rec{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.files li:has(.mrow){align-items:flex-start}
.mrow + .muted{flex:none;text-align:right}
.rec li{flex-wrap:wrap}
.pill.soon{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.topics{display:flex;flex-direction:column;gap:8px}
.topic{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:10px;align-items:center;font-size:.95rem}
.topic .nm{min-width:0;overflow-wrap:anywhere}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--good)}
.meter span.mid{background:var(--warn)} .meter span.low{background:var(--bad)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}.spin{animation:none}}
.pre{white-space:pre-wrap}
code{font-size:.9em;background:var(--chip);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="eyebrow">Tentquiz</p><h1>Laddar…</h1></div>
<noscript><p>Tentquiz behöver JavaScript.</p></noscript>
<script>
(() => {
"use strict";
const app = document.getElementById("app");
const PDF_LIB = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDF_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const MAMMOTH = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
const JSZIP = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
const OR_URL = "https://openrouter.ai/api/v1";
const VERSION = "1.5 · 20.10.2026";
const DEFAULT_MODEL = "";
const PROMPT_MATERIAL = 120000;
const STATE_FILE = "tentquiz.json", CACHE_FILE = "tentquiz-text.json";
const MAT_RE = /\.(pdf|docx|pptx|txt|md)$/i;
const HAS_FS = typeof window.showDirectoryPicker === "function";

const TYPES = {
  mc:    {label:"Flerval (ett rätt)", short:"Flerval", closed:true},
  multi: {label:"Flerval (flera rätt)", short:"Flera rätt", closed:true},
  tf:    {label:"Sant/falskt", short:"Sant/falskt", closed:true},
  short: {label:"Kortsvar", short:"Kortsvar", closed:false},
  calc:  {label:"Räkneuppgift", short:"Räkne", closed:false},
  essay: {label:"Essä", short:"Essä", closed:false},
};
const L = "ABCDEF";

// ---------- hjälpare
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const shuffle = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const num = (v, d = 0) => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : d; };
const fmtP = p => (Math.round(p * 10) / 10).toString().replace(".", ",");
const signed = p => (p > 0 ? "+" : "") + fmtP(p);
const byId = id => document.getElementById(id);
const on = (id, ev, fn) => { const el = byId(id); if (el) el.addEventListener(ev, fn); return el; };
const top = () => window.scrollTo({top:0});
const fmtChars = n => n >= 1000 ? Math.round(n / 1000) + " k tecken" : n + " tecken";
const daysTo = d => { if (!d) return null; const t = new Date(d + "T00:00:00"); if (isNaN(t)) return null; const now = new Date(); now.setHours(0,0,0,0); return Math.round((t - now) / 86400000); };
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set: (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); return localStorage.getItem(k) === v; } catch (_) { return false; } },
};
const ss = {
  get: k => { try { return sessionStorage.getItem(k); } catch (_) { return null; } },
  set: (k, v) => { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (_) {} },
};
// Be webbläsaren att inte rensa appens data automatiskt när disken blir full
const persistStorage = () => { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) {} };

function errText(e) {
  const c = e && e.code;
  return ({
    no_key: "Lägg in din OpenRouter-nyckel under Inställningar först.",
    bad_key: "OpenRouter godkände inte nyckeln. Kontrollera den under Inställningar.",
    no_credits: "Ditt OpenRouter-konto saknar krediter. Fyll på på openrouter.ai.",
    no_model: "Välj en AI-modell under Inställningar först.",
    model_restricted: "Den valda gratismodellen får bara användas i vissa utvalda appar hos OpenRouter och fungerar inte i Tentquiz. Välj en annan modell under Inställningar.",
    rate_limited: "Gränsen är nådd. Gratismodeller tillåter 50 anrop per dag utan köpta krediter (1 000 per dag om du köpt minst 10 krediter), och kan också vara tillfälligt överbelastade. Vänta en stund, prova en annan gratismodell eller välj en billig betalmodell.",
    too_large: "Materialet är för stort för den valda modellen. Välj en modell med större kontext eller ta bort material.",
    bad_model: "Modellen finns inte hos OpenRouter. Välj en annan under Inställningar.",
    network: "Kunde inte nå OpenRouter. Kontrollera internetanslutningen.",
    empty: "Inget svar kom tillbaka. Försök igen.",
    invalid_json: "Svaret gick inte att läsa. Försök igen.",
    no_permission: "Appen har inte fått tillgång till mappen.",
  })[c] || ((e && e.message) ? "Fel: " + e.message : "Något gick fel. Försök igen.");
}

// ---------- IndexedDB (lista över tentor + lagring när mappar inte stöds)
let dbp = null;
const idb = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open("tentquiz", 1);
  r.onupgradeneeded = () => { r.result.createObjectStore("courses", {keyPath:"id"}); r.result.createObjectStore("blobs"); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const store = async (name, mode = "readonly") => (await idb()).transaction(name, mode).objectStore(name);
const idbGet = async (s, k) => rq((await store(s)).get(k));
const idbPut = async (s, v, k) => rq((await store(s, "readwrite")).put(v, k));
const idbDel = async (s, k) => rq((await store(s, "readwrite")).delete(k));
const idbAll = async s => rq((await store(s)).getAll());

// ---------- lagring per tenta: en mapp (fs) eller webbläsaren (local)
async function hasPerm(c, askNow) {
  if (c.kind !== "fs") return true;
  const o = {mode:"readwrite"};
  if (!c.handle.queryPermission) return true;
  if (await c.handle.queryPermission(o) === "granted") return true;
  if (askNow) return (await c.handle.requestPermission(o)) === "granted";
  return false;
}
async function readJSON(c, name) {
  if (c.kind === "fs") { try { const fh = await c.handle.getFileHandle(name); return JSON.parse(await (await fh.getFile()).text()); } catch (_) { return null; } }
  return (await idbGet("blobs", c.id + "#" + name)) || null;
}
const writeQ = {};
function writeJSON(c, name, obj) {
  const key = c.id + "#" + name, data = JSON.stringify(obj, null, 1);
  writeQ[key] = (writeQ[key] || Promise.resolve()).then(async () => {
    if (c.kind === "fs") { const fh = await c.handle.getFileHandle(name, {create:true}); const w = await fh.createWritable(); await w.write(data); await w.close(); }
    else await idbPut("blobs", JSON.parse(data), key);
  }).catch(e => { console.warn("write", name, e); S.banner = "Kunde inte spara till " + (c.kind === "fs" ? "mappen" : "webbläsaren") + ". Kontrollera att mappen finns kvar."; });
  return writeQ[key];
}
async function listFiles(c) {
  const out = [];
  if (c.kind === "fs") {
    const walk = async (dir, prefix, depth) => {
      for await (const [name, h] of dir.entries()) {
        if (name.startsWith(".") || name.startsWith("~$") || /^tentquiz/i.test(name)) continue;
        if (h.kind === "file" && MAT_RE.test(name)) { const f = await h.getFile(); out.push({name:prefix + name, size:f.size, lastModified:f.lastModified, get:() => Promise.resolve(f)}); }
        else if (h.kind === "directory" && depth < 2) await walk(h, prefix + name + "/", depth + 1);
      }
    };
    await walk(c.handle, "", 0);
  } else {
    for (const n of c.files || []) { const b = await idbGet("blobs", c.id + "/f/" + n); if (b) out.push({name:n, size:b.size, lastModified:b.lastModified || 0, get:() => Promise.resolve(b)}); }
  }
  return out.sort((a, b) => a.name.localeCompare(b.name, "sv", {numeric:true}));
}
async function addFiles(c, files) {
  if (c.kind === "fs") {
    for (const f of files) { const fh = await c.handle.getFileHandle(f.name, {create:true}); const w = await fh.createWritable(); await w.write(f); await w.close(); }
  } else {
    c.files = c.files || [];
    for (const f of files) { await idbPut("blobs", new File([f], f.name, {type:f.type, lastModified:Date.now()}), c.id + "/f/" + f.name); if (!c.files.includes(f.name)) c.files.push(f.name); }
    await idbPut("courses", recordOf(c));
  }
}
async function removeLocalFile(c, name) {
  await idbDel("blobs", c.id + "/f/" + name); c.files = (c.files || []).filter(n => n !== name); await idbPut("courses", recordOf(c));
}
const recordOf = c => ({id:c.id, kind:c.kind, name:c.name, handle:c.handle, files:c.files, added:c.added});

// ---------- tillstånd
const S = {
  courses:[], view:"home", course:null, state:null, material:null, matInfo:null, loading:false,
  edit:null, P:null, E:null, banner:null, settingsMsg:null, models:null,
};
const blankProgress = () => ({answered:0, correct:0, topics:{}, missed:[], recent:[], sessions:[]});
const LANGS = {sv:"svenska", fi:"finska", en:"engelska", auto:""};
const langOf = () => (S.state && S.state.lang) || "sv";
function langRule(what) {
  const l = langOf();
  if (l === "auto") return `SPRÅK: Skriv ${what} på samma språk som huvuddelen av kursmaterialet.`;
  return `SPRÅK – VIKTIGT: Skriv ${what} på ${LANGS[l]}, även om kursmaterialet eller delar av det är på ett annat språk. Facktermer får anges inom parentes på originalspråket när det hjälper.`;
}
const blankState = name => ({version:1, name, lang:"sv", examDate:"", info:"", minutes:"", scale:"", parts:[{type:"mc", count:20, plus:1, minus:0}], topics:[], topicsKey:"", progress:blankProgress()});

let saveT = null;
function markProgress() { clearTimeout(saveT); saveT = setTimeout(saveState, 1500); }
function saveState() { clearTimeout(saveT); saveT = null; if (S.course && S.state) return writeJSON(S.course, STATE_FILE, S.state); return Promise.resolve(); }

async function loadCourses() {
  const recs = await idbAll("courses").catch(() => []);
  S.courses = recs.sort((a, b) => (b.added || 0) - (a.added || 0));
  for (const c of S.courses) { c.ok = await hasPerm(c, false).catch(() => false); if (c.ok) { const st = await readJSON(c, STATE_FILE); if (st) c.meta = st; } }
}

async function openCourse(c) {
  await saveState();

  c.ok = true;
  S.course = c; S.state = null; S.material = null; S.view = "course"; S.loading = "Läser kursens fil…"; render(); top();
  let st = await readJSON(c, STATE_FILE);
  if (!st) { st = blankState(c.name); await writeJSON(c, STATE_FILE, st); }
  st.progress = {...blankProgress(), ...(st.progress || {})};

async function loadMaterial() {
  const c = S.course;
  S.loading = "Läser materialet…"; if (S.view === "course") render();
  let files = [];
  try { files = await listFiles(c); } catch (e) { S.banner = "Kunde inte läsa mappen. Har den flyttats eller tagits bort?"; S.loading = false; S.material = []; return render(); }
  const cache = (await readJSON(c, CACHE_FILE)) || {files:{}};
  const fresh = {}, errs = [];
  let changed = false, i = 0;
  for (const f of files) {
    i++;
    const key = f.name + "|" + f.size + "|" + f.lastModified;
    if (cache.files[key]) { fresh[key] = cache.files[key]; continue; }
    S.loading = `Läser ${f.name} (${i} av ${files.length})…`; if (S.view === "course") render();
    try { const text = (await extract(await f.get(), f.name)).trim(); fresh[key] = {name:f.name, text}; if (text.length < 20) errs.push(f.name + " (ingen text – är det en skannad bild?)"); }
    catch (e) { console.warn(e); errs.push(f.name); fresh[key] = {name:f.name, text:"", failed:true}; }
    changed = true;
  }
  if (Object.keys(cache.files).some(k => !fresh[k])) changed = true;
  if (changed) await writeJSON(c, CACHE_FILE, {files:fresh});
  S.material = Object.values(fresh).filter(m => m.text);
  S.matInfo = {files:files.map(f => ({name:f.name, chars:(fresh[f.name + "|" + f.size + "|" + f.lastModified] || {}).text?.length || 0})), key:Object.keys(fresh).sort().join(";"), errs};
  if (errs.length) S.banner = "Kunde inte läsa text ur: " + errs.join(", ");
  S.loading = false;
  if (S.view === "course" || S.view === "edit") render();
}

// ---------- filer till text
function loadScript(src) {
  return new Promise((res, rej) => {
    const ex = document.querySelector(`script[data-src="${src}"]`);
    if (ex) { if (ex.dataset.ok) return res(); ex.addEventListener("load", res); ex.addEventListener("error", rej); return; }
    const s = document.createElement("script"); s.src = src; s.dataset.src = src;
    s.onload = () => { s.dataset.ok = "1"; res(); }; s.onerror = () => rej(new Error("Kunde inte ladda " + src));
    document.head.appendChild(s);
  });
}
async function extract(f, name) {
  const n = (name || f.name || "").toLowerCase();
  if (n.endsWith(".pdf")) return pdfText(f);
  if (n.endsWith(".docx")) { await loadScript(MAMMOTH); return (await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value; }
  if (n.endsWith(".pptx")) return pptxText(f);
  return f.text();
}
async function pdfText(f) {
  await loadScript(PDF_WORKER); await loadScript(PDF_LIB);
  const doc = await window.pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer()), isEvalSupported:false, disableFontFace:true}).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    let s = "", lastY = null;
    for (const it of tc.items) {
      if (!("str" in it)) continue;
      const y = it.transform ? it.transform[5] : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) s += "\n"; else if (s && !/\s$/.test(s) && it.str && !/^\s/.test(it.str)) s += " ";
      s += it.str; if (it.hasEOL) s += "\n"; lastY = y;
    }
    pages.push(s.replace(/[ \t]+/g, " ").replace(/\n\s*\n+/g, "\n").trim());
  }
  return pages.filter(Boolean).join("\n\n");
}
async function pptxText(f) {
  await loadScript(JSZIP);
  const zip = await window.JSZip.loadAsync(await f.arrayBuffer());
  const slides = Object.keys(zip.files).filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a, b) => parseInt(a.match(/\d+/)[0]) - parseInt(b.match(/\d+/)[0]));
  const dec = s => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&");
  const out = [];
  for (const k of slides) {
    const xml = await zip.file(k).async("string");
    const paras = xml.split(/<\/a:p>/).map(p => [...p.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m => dec(m[1])).join("")).filter(t => t.trim());
    if (paras.length) out.push(paras.join("\n"));
  }
  return out.join("\n\n");
}

// ----- Logga in med OpenRouter (OAuth PKCE): appen får en egen nyckel utan att man kopierar något
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const callbackUrl = () => location.origin + location.pathname;
async function orLogin() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  ss.set("tp.pkce", JSON.stringify({verifier, state}));
  location.href = "https://openrouter.ai/auth?" + new URLSearchParams({callback_url:callbackUrl(), code_challenge:challenge, code_challenge_method:"S256", key_label:"Tentquiz", state});
}
// Körs vid start: tar hand om återkomsten från OpenRouter. Returnerar ett meddelande till inställningssidan, eller null.
async function orCallback() {
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error");
  if (!code && !err) return null;
  history.replaceState(null, "", callbackUrl() + location.hash);
  let saved = null; try { saved = JSON.parse(ss.get("tp.pkce") || "null"); } catch (_) {}
  ss.set("tp.pkce", null);
  if (!code) return {text:"Inloggningen avbröts. Inget har ändrats.", err:true};
  if (!saved || (q.get("state") && q.get("state") !== saved.state)) return {text:"Inloggningen kunde inte slutföras (öppnades den i en annan flik?). Försök igen.", err:true};
  try {
    const r = await fetch(OR_URL + "/auth/keys", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({code, code_verifier:saved.verifier, code_challenge_method:"S256"})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.key) throw new Error((d.error && d.error.message) || "HTTP " + r.status);
    if (!saveKey(d.key)) return {text:"Inloggad, men " + STORE_FAIL[0].toLowerCase() + STORE_FAIL.slice(1), err:true};
    return {text:"Inloggad med OpenRouter. Nyckeln är sparad i den här webbläsaren och finns kvar nästa gång du öppnar appen."};
  } catch (e) { return {text:"Kunde inte hämta nyckeln från OpenRouter: " + (e.message || "okänt fel") + ". Försök igen.", err:true}; }
}
const getModel = () => ls.get("tp.model") || DEFAULT_MODEL;
const restricted = msg => /agentic|only available (on|in|to)|not available for this (app|client)|openrouter\.ai\/apps/i.test(msg || "");

async function ask(prompt, opts = {}) {
  try { return await askRaw(prompt, opts); }
  catch (e) {
    // Vald modell visade sig vara spärrad för appar som Tentquiz: göm den och nollställ valet
    if (e && e.code === "model_restricted" && !opts.model && getModel()) { markBad(getModel()); ls.set("tp.model", null); }

}
async function askRaw(prompt, {json = false, onText, signal, model} = {}) {
  const key = getKey(); if (!key) throw {code:"no_key"};
  if (!model && !getModel()) throw {code:"no_model"};
  let res;
  try {
    res = await fetch(OR_URL + "/chat/completions", {method:"POST", signal,
      headers:{"Authorization":"Bearer " + key, "Content-Type":"application/json", "X-Title":"Tentquiz"},

  } catch (e) { if (e && e.name === "AbortError") throw {code:"cancelled"}; throw {code:"network"}; }

        if (!line.startsWith("data:")) continue;
        const d = line.slice(5).trim(); if (d === "[DONE]") continue;
        let j; try { j = JSON.parse(d); } catch (_) { continue; }
        if (j.error) throw {code:restricted(j.error.message) ? "model_restricted" : "http", message:j.error.message || "Fel från modellen"};
        const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content || "";

function parseQ(line) {

}

// ---------- poäng
function scaleRows(txt) {
  const rows = [], re = /(\d+(?:[.,]\d+)?)\s*(?:-|–|—|till)\s*(\d+(?:[.,]\d+)?)\s*(?:p(?:oäng)?\.?)?\s*(?:=|:|→|->)\s*([^\s,;]+)/gi;
  let m; while ((m = re.exec(txt || ""))) rows.push({min:num(m[1]), max:num(m[2]), g:m[3]});
  return rows.sort((a, b) => b.min - a.min);
}
function gradeFor(p, txt) {
  const rows = scaleRows(txt); if (!rows.length) return null;
  for (const r of rows) if (p >= r.min) return "Vitsord " + r.g;
  return "Underkänt (gränsen är " + fmtP(rows[rows.length - 1].min) + " p)";
}
function scoring(type) { const p = partFor(type); return p ? {plus:num(p.plus, 1), minus:num(p.minus, 0)} : {plus:1, minus:0}; }
const maxPoints = c => (c.parts || []).reduce((s, p) => s + num(p.count) * (TYPES[p.type] && TYPES[p.type].closed ? num(p.plus, 1) : num(p.points, 0)), 0);
const totalQ = c => (c.parts || []).reduce((s, p) => s + num(p.count), 0);
function checkClosed(q, a) {
  if (a === null || a === undefined || (Array.isArray(a) && !a.length)) return null;
  if (q.type === "mc") return a === q.correct;
  if (q.type === "tf") return a === q.answer;
  if (q.type === "multi") return [...a].sort().join(",") === q.correct.join(",");
  return null;
}
function correctText(q) {
  if (q.type === "mc") return q.options[q.correct];
  if (q.type === "multi") return q.correct.map(k => q.options[k]).join(" · ");
  if (q.type === "tf") return q.answer ? "Sant" : "Falskt";
  return q.answer || q.solution || "";
}
function answerText(q, a) {
  if (a === null || a === undefined) return "";
  if (q.type === "mc") return q.options[a];
  if (q.type === "multi") return a.map(k => q.options[k]).join(" · ");
  if (q.type === "tf") return a ? "Sant" : "Falskt";
  return String(a);
}

function record(q, ok, partial) {
  const p = prog(); if (!p) return;
  p.answered++; if (ok) p.correct++;
  const t = q.topic || "Övrigt"; p.topics[t] = p.topics[t] || {r:0, w:0};
  if (ok) p.topics[t].r++; else p.topics[t].w++;
  const key = q.q.slice(0, 200);
  p.missed = (p.missed || []).filter(m => m.q.slice(0, 200) !== key);
  if (!ok && !partial) { const c = JSON.parse(JSON.stringify(q)); delete c.perm; p.missed.push(c); if (p.missed.length > 150) p.missed = p.missed.slice(-150); }
  markProgress();
}
function noteAsked(q) { const p = prog(); if (!p) return; p.recent = (p.recent || []).concat(q.q.slice(0, 160)).slice(-120); markProgress(); }

  const t = (prog() && prog().topics) || {};
  return Object.entries(t).map(([k, v]) => ({k, n:v.r + v.w, acc:v.r / Math.max(1, v.r + v.w)})).filter(x => x.n >= 3).sort((a, b) => a.acc - b.acc);
}

function batchSpec(types) {

  closed.forEach((t, i) => spec.push({type:t, n:Math.floor(n / closed.length) + (i < n % closed.length ? 1 : 0)}));
  open.forEach(t => spec.push({type:t, n:1}));
  return spec.filter(x => x.n > 0);
}

}

function bindQuestion(P) {
  const q = P.list[P.i]; if (!q) return;
  const res = P.res[P.i];
  if (!res || res.error) {
    if (q.type === "mc") app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => answerClosed(P, +b.dataset.o));
    if (q.type === "multi") app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { const o = +b.dataset.o, s = P.drafts[q.id] || []; P.drafts[q.id] = s.includes(o) ? s.filter(x => x !== o) : s.concat(o); b.classList.toggle("sel"); });
    if (q.type === "tf") app.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => answerClosed(P, b.dataset.tf === "true"));
    on("submit", "click", () => { const s = P.drafts[q.id] || []; if (s.length) answerClosed(P, s.slice()); });
    on("skip", "click", () => { P.res[P.i] = TYPES[q.type].closed ? {skip:true, ok:false, pts:0, max:0} : {skip:true, ok:false, pts:0, max:0, a:(byId("ans") || {}).value || "", g:{model:q.answer}}; render(); });
    on("ans", "input", ev => P.drafts[q.id] = ev.target.value);
    on("grade", "click", () => gradePractice(P));
  }
  on("next", "click", () => { P.i++; render(); top(); });
  on("flag", "click", () => {
    const r = P.res[P.i]; r.flagged = true; const pr = prog();
    if (pr) { const t = pr.topics[q.topic]; if (t) { if (r.ok) { t.r = Math.max(0, t.r - 1); pr.correct = Math.max(0, pr.correct - 1); } else t.w = Math.max(0, t.w - 1); } pr.answered = Math.max(0, pr.answered - 1); pr.missed = (pr.missed || []).filter(m => m.q !== q.q); markProgress(); }
    render();
  });
}
function answerClosed(P, a) {
  const q = P.list[P.i], ok = checkClosed(q, a), sc = scoring(q.type);
  P.res[P.i] = {a, ok, pts:ok ? sc.plus : -sc.minus, max:sc.plus};
  record(q, ok); render();
}
async function gradePractice(P) {
  const q = P.list[P.i], a = (byId("ans") || {}).value || "", idx = P.i;
  if (!a.trim()) return byId("ans").focus();
  P.drafts[q.id] = a; P.res[idx] = {grading:true, a}; render();
  try {
    const g = await gradeOpen(q, a, q.points);
    if (S.P !== P) return;
    P.res[idx] = {a, g, ok:g.points >= g.max * 0.75, pts:g.points, max:g.max};
    record(q, g.points >= g.max * 0.75, g.points > 0 && g.points < g.max * 0.75);
  } catch (e) { if (S.P !== P) return; P.res[idx] = {error:errText(e)}; }
  if (S.view === "practice" && P.i === idx) render();
}
async function endPractice() {
  const P = S.P; if (P && P.ctl) P.ctl.abort();
  if (P) { const sc = practiceScore(P); if (sc.r + sc.w) addSession({mode:P.missed ? "Repetition" : "Snabbövning", pts:sc.pts, max:sc.max, r:sc.r, w:sc.w, s:sc.s}); }
  S.P = null; S.view = "course"; await saveState(); render(); top();
}

// ----- provtenta
function startExam() {
  const E = {qs:[], parts:[], ans:{}, i:0, phase:"gen", made:0, total:totalQ(S.state), err:null, ctl:new AbortController(), end:0, tm:0, confirm:false};
  S.E = E; S.view = "exam"; render(); top();
  genExam(E);
}
async function genExam(E) {
  const c = S.state, jobs = [];
  (c.parts || []).forEach((p, pi) => {
    E.parts[pi] = [];
    const size = TYPES[p.type].closed ? 15 : (p.type === "essay" ? 2 : 4);
    for (let left = p.count; left > 0; left -= size) jobs.push({pi, type:p.type, n:Math.min(size, left), got:0});
  });
  const run = async job => {
    for (let tries = 0; tries < 2 && !E.ctl.signal.aborted && job.got < job.n; tries++) {
      const got = await generate({spec:[{type:job.type, n:job.n - job.got}], signal:E.ctl.signal, onQ:q => { E.parts[job.pi].push(q); E.made++; job.got++; if (S.E === E && E.phase === "gen") updateGen(E); }});
      if (!got.length) break;
    }
  };
  try {
    const queue = jobs.slice();
    const worker = async () => { while (queue.length && !E.ctl.signal.aborted) await run(queue.shift()); };
    await Promise.all([worker(), worker()]);
  } catch (e) { if (e && e.code !== "cancelled") E.err = errText(e); }
  if (S.E !== E || E.ctl.signal.aborted) return;
  E.qs = E.parts.flat(); E.qs.forEach(noteAsked);
  E.phase = "ready"; render();
}
function updateGen(E) { const el = byId("genc"); if (el) el.textContent = E.made + " av " + E.total; const bar = byId("genbar"); if (bar) bar.style.width = Math.round(100 * E.made / Math.max(1, E.total)) + "%"; }
const fmtT = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function beginExam(E) {
  const mins = num(S.state.minutes, 0);
  E.phase = "run"; E.i = 0;
  if (mins > 0) { E.end = Date.now() + mins * 60000; E.tm = setInterval(() => tickExam(E), 1000); }
  render(); top();
}
function tickExam(E) {
  if (S.E !== E || E.phase !== "run") return clearInterval(E.tm);
  const left = E.end - Date.now(), el = byId("timer");
  if (el) { el.textContent = fmtT(left); el.classList.toggle("low", left < 5 * 60000); }
  if (left <= 0) submitExam(E, true);
}
const answered = (E, q) => { const a = E.ans[q.id]; return !(a === undefined || a === null || (Array.isArray(a) && !a.length) || (typeof a === "string" && !a.trim())); };
const examMax = E => E.qs.reduce((s, q) => s + (TYPES[q.type].closed ? scoring(q.type).plus : q.points), 0);
function renderExam() {
  const E = S.E, c = S.state; if (!E) { S.view = "course"; return render(); }
  const back = () => { S.E = null; S.view = "course"; render(); top(); };
  if (E.phase === "gen") {
    app.innerHTML = `<div class="row between"><button class="link" id="cancel">← Avbryt</button></div><h1>Provtenta</h1>
    <div class="card"><p><span class="spin"></span> AI:n skriver tentan: <b id="genc">${E.made} av ${E.total}</b> frågor klara.</p><div class="progress"><span id="genbar" style="width:${Math.round(100 * E.made / Math.max(1, E.total))}%"></span></div>
    <p class="muted small">Klockan startar först när du trycker på Börja skriva.</p></div>`;
    on("cancel", "click", () => { E.ctl.abort(); back(); });
    return;
  }
  if (E.phase === "ready") {
    const n = E.qs.length;
    app.innerHTML = `<div class="row between"><button class="link" id="cancel">← Tillbaka</button></div><h1>Provtentan är klar</h1>
    <div class="card">${E.err ? `<div class="notice err">${esc(E.err)}</div>` : ""}
    ${n ? `<p>${n} frågor${n < E.total ? ` (av ${E.total} planerade)` : ""}${c.minutes ? ", " + c.minutes + " minuter" : ", ingen tidsgräns"}. Max ${fmtP(examMax(E))} p.</p>
    <p class="muted small">${(c.parts || []).filter(p => TYPES[p.type].closed).map(p => TYPES[p.type].label + ": +" + fmtP(p.plus) + " rätt, −" + fmtP(p.minus) + " fel, 0 obesvarad").join(" · ")}</p>
    ${c.scale ? `<p class="muted small">Vitsord: ${esc(c.scale)}</p>` : ""}
    <div class="actions"><button class="btn" id="begin">Börja skriva</button></div>` : `<p>Inga frågor kunde skapas.</p><div class="actions"><button class="btn" id="retry">Försök igen</button></div>`}</div>`;
    on("cancel", "click", back); on("begin", "click", () => beginExam(E)); on("retry", "click", startExam);
    return;
  }
  if (E.phase === "run") return renderExamQ(E);
  if (E.phase === "grading") { app.innerHTML = `<h1>Rättar…</h1><div class="card"><p><span class="spin"></span> AI:n rättar dina öppna svar: <b>${E.graded} av ${E.toGrade}</b>.</p></div>`; return; }
  if (E.phase === "done") return renderExamResult(E);
}
function renderExamQ(E) {
  const k = E.i, n = E.qs.length, q = E.qs[k], a = E.ans[q.id], done = E.qs.filter(x => answered(E, x)).length, open = n - done;
  const left = E.end ? E.end - Date.now() : 0, sc = TYPES[q.type].closed ? scoring(q.type) : null;
  let inner;
  if (q.type === "mc" || q.type === "multi") inner = `<div class="opts">${q.perm.map((oi, j) => { const s = q.type === "mc" ? a === oi : (a || []).includes(oi); return `<button class="opt${s ? " sel" : ""}" data-o="${oi}" aria-pressed="${s}"><span class="k">${L[j]}</span><span>${esc(q.options[oi])}</span></button>`; }).join("")}</div>`;
  else if (q.type === "tf") inner = `<div class="tf">${[true, false].map(v => `<button class="opt${a === v ? " sel" : ""}" data-tf="${v}" aria-pressed="${a === v}">${v ? "Sant" : "Falskt"}</button>`).join("")}</div>`;
  else inner = `<textarea id="ans" class="${q.type === "essay" ? "essay" : "answer"}" placeholder="Skriv ditt svar">${esc(a || "")}</textarea>`;
  app.innerHTML = `<div class="bar"><span class="score timer${E.end && left < 5 * 60000 ? " low" : ""}" id="timer">${E.end ? fmtT(left) : "Ingen tidsgräns"}</span><span class="tally"><span>Fråga ${k + 1}/${n}</span><span id="donec">${done} besvarade</span></span></div>
  <div class="card"><p class="eyebrow">${esc(TYPES[q.type].label)}${sc ? ` · +${fmtP(sc.plus)}/−${fmtP(sc.minus)}` : ` · max ${fmtP(q.points)} p`}</p><h2 class="pre">${esc(q.q)}</h2>
  ${q.type === "multi" ? `<p class="muted small">Flera alternativ kan vara rätt.</p>` : ""}${inner}
  <p class="muted small">${TYPES[q.type].closed ? (answered(E, q) ? "Tryck på ditt val igen för att ta bort svaret." : "En obesvarad fråga ger 0 p.") : "Svaret sparas medan du skriver."}</p>
  <div class="actions"><button class="btn ghost" id="prev"${k === 0 ? " disabled" : ""}>← Föregående</button><button class="btn" id="nextq">${k === n - 1 ? "Lämna in…" : "Nästa →"}</button></div></div>
  <div class="card"><p class="eyebrow">Översikt</p><div class="grid">${E.qs.map((x, j) => `<button class="gq${answered(E, x) ? " done" : ""}${j === k ? " cur" : ""}" data-g="${j}" aria-label="Fråga ${j + 1}">${j + 1}</button>`).join("")}</div>
  <div id="sub">${E.confirm ? `<p><b>Lämna in nu?</b> ${open === 0 ? "Alla frågor är besvarade." : open === 1 ? "1 fråga är obesvarad och ger 0 p." : open + " frågor är obesvarade och ger 0 p."}</p><div class="actions"><button class="btn" id="yes">Lämna in</button><button class="btn ghost" id="no">Fortsätt skriva</button></div>` : `<div class="actions"><button class="btn ghost" id="submitx">Lämna in tentan</button></div>`}</div></div>`;
  const go = j => { E.i = j; E.confirm = false; render(); top(); };
  const askSubmit = () => { E.confirm = true; render(); byId("sub").scrollIntoView({block:"center"}); };
  if (q.type === "mc") app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { const o = +b.dataset.o; E.ans[q.id] = E.ans[q.id] === o ? undefined : o; render(); });
  if (q.type === "multi") app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { const o = +b.dataset.o, s = E.ans[q.id] || []; E.ans[q.id] = s.includes(o) ? s.filter(x => x !== o) : s.concat(o); render(); });
  if (q.type === "tf") app.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => { const v = b.dataset.tf === "true"; E.ans[q.id] = E.ans[q.id] === v ? undefined : v; render(); });
  on("ans", "input", ev => { E.ans[q.id] = ev.target.value; const d = byId("donec"); if (d) d.textContent = E.qs.filter(x => answered(E, x)).length + " besvarade"; const g = app.querySelector(`[data-g="${k}"]`); if (g) g.classList.toggle("done", answered(E, q)); });
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => go(+b.dataset.g));
  if (k > 0) on("prev", "click", () => go(k - 1));
  on("nextq", "click", () => k === n - 1 ? askSubmit() : go(k + 1));
  on("submitx", "click", askSubmit);
  on("no", "click", () => { E.confirm = false; render(); });
  on("yes", "click", () => submitExam(E, false));
}
async function submitExam(E, timeout) {
  if (E.phase !== "run") return;
  clearInterval(E.tm); E.timeout = timeout; E.results = {};
  for (const q of E.qs) if (TYPES[q.type].closed) {
    const ok = answered(E, q) ? checkClosed(q, E.ans[q.id]) : null, sc = scoring(q.type);
    E.results[q.id] = {ok, pts:ok === null ? 0 : ok ? sc.plus : -sc.minus, max:sc.plus};
  }
  const open = E.qs.filter(q => !TYPES[q.type].closed);
  E.toGrade = open.length; E.graded = 0;
  if (open.length) { E.phase = "grading"; render(); top(); }
  for (const q of open) {
    const a = E.ans[q.id] || "";
    try { const g = await gradeOpen(q, a, q.points); E.results[q.id] = {ok:g.points >= g.max * 0.75, partial:g.points > 0 && g.points < g.max * 0.75, pts:g.points, max:g.max, g, blank:!a.trim()}; }
    catch (e) { E.results[q.id] = {ok:false, pts:0, max:q.points, g:{feedback:"Kunde inte rättas: " + errText(e), model:q.answer, missing:[]}, failed:true}; }
    E.graded++; if (S.E === E) render();
  }
  const pr = prog();
  for (const q of E.qs) {
    const r = E.results[q.id];
    if (TYPES[q.type].closed && r.ok === null) { if (pr) { const c = JSON.parse(JSON.stringify(q)); delete c.perm; pr.missed = (pr.missed || []).filter(m => m.q !== q.q).concat(c).slice(-150); } }
    else if (r.blank) record(q, false);
    else if (!r.failed) record(q, r.ok, r.partial);
  }
  const t = examTotals(E), full = maxPoints(S.state);
  E.adj = t.max && full && Math.abs(t.max - full) > 0.01 ? Math.round(t.pts * full / t.max * 2) / 2 : null;
  E.grade = gradeFor(E.adj !== null ? E.adj : t.pts, S.state.scale);
  addSession({mode:"Provtenta", pts:t.pts, max:t.max, r:t.r, w:t.w, s:t.s, grade:E.grade || ""});
  saveState();
  E.phase = "done"; if (S.E === E) { render(); top(); }
}
function examTotals(E) {
  let pts = 0, max = 0, r = 0, w = 0, s = 0;
  for (const q of E.qs) { const x = E.results[q.id]; pts += x.pts; max += x.max; if (x.ok === null || x.blank) s++; else if (x.ok) r++; else w++; }
  return {pts, max, r, w, s};
}
function renderExamResult(E) {
  const t = examTotals(E), c = S.state;
  const byPart = (c.parts || []).map(p => { const qs = E.qs.filter(q => q.type === p.type); return {label:TYPES[p.type].label, pts:qs.reduce((s, q) => s + E.results[q.id].pts, 0), max:qs.reduce((s, q) => s + E.results[q.id].max, 0), n:qs.length}; }).filter(x => x.n);
  const item = q => { const x = E.results[q.id], a = E.ans[q.id];
    if (TYPES[q.type].closed) return `<li><span class="pre">${esc(q.q)}</span>${x.ok === null ? `<span class="x">Obesvarad</span>` : `<span class="y">Ditt svar: ${esc(answerText(q, a))}</span>`}<span class="a">Rätt: ${esc(correctText(q))}</span><span class="x">${esc(q.explanation)}</span></li>`;
    const g = x.g || {}; return `<li><span class="pre">${esc(q.q)}</span><span><b>${fmtP(x.pts)} av ${fmtP(x.max)} p</b></span>${a && a.trim() ? `<span class="x pre">Ditt svar: ${esc(a)}</span>` : `<span class="x">Obesvarad</span>`}${g.feedback ? `<span>${esc(g.feedback)}</span>` : ""}${g.missing && g.missing.length ? `<span class="x">Saknades: ${g.missing.map(esc).join(" · ")}</span>` : ""}<span class="a pre">Mönstersvar: ${esc(g.model || q.answer)}</span></li>`; };
  const wrong = E.qs.filter(q => TYPES[q.type].closed && E.results[q.id].ok === false);
  const blank = E.qs.filter(q => TYPES[q.type].closed && E.results[q.id].ok === null);
  const openQ = E.qs.filter(q => !TYPES[q.type].closed);
  app.innerHTML = `<p class="eyebrow">${E.timeout ? "Tiden tog slut" : "Inlämnad"}</p><h1>Resultat</h1>
  <div class="card"><span class="big">${fmtP(t.pts)} / ${fmtP(t.max)}</span>${E.grade ? `<span class="grade">${esc(E.grade)}</span>` : ""}
  ${E.adj !== null ? `<p class="muted small">Provtentan blev kortare än den riktiga, så poängen är omräknad till ${fmtP(E.adj)} av ${fmtP(maxPoints(c))} p innan vitsordet sattes.</p>` : ""}
  <p class="muted">✓ ${t.r} rätt · ✗ ${t.w} fel · – ${t.s} obesvarade</p>
  ${byPart.length > 1 ? `<ul class="files">${byPart.map(b => `<li><span>${esc(b.label)}</span><span class="muted small">${fmtP(b.pts)} / ${fmtP(b.max)} p</span></li>`).join("")}</ul>` : ""}
  <div class="actions"><button class="btn" id="again">Ny provtenta</button><button class="btn ghost" id="back">Till tentan</button></div></div>
  ${openQ.length ? `<div class="card"><h2>Öppna frågor</h2><ul class="list">${openQ.map(item).join("")}</ul></div>` : ""}
  ${wrong.length ? `<div class="card"><h2>Fel svar (${wrong.length})</h2><ul class="list">${wrong.map(item).join("")}</ul></div>` : ""}
  ${blank.length ? `<div class="card"><h2>Obesvarade (${blank.length})</h2><ul class="list">${blank.map(item).join("")}</ul></div>` : ""}
  <p class="muted small">Felsvarade och obesvarade frågor ligger nu under ”Frågor du missat”.</p>`;
  on("again", "click", startExam);
  on("back", "click", () => { S.E = null; S.view = "course"; render(); top(); });
}

window.addEventListener("pagehide", () => { saveState(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveState(); });
window.addEventListener("beforeunload", ev => { if (S.E && S.E.phase === "run") { ev.preventDefault(); ev.returnValue = ""; } });

(async () => {
  const login = await orCallback();
  if (login) { S.view = "settings"; S.settingsMsg = login; }
  if (getKey()) persistStorage();
  try { await loadCourses(); } catch (e) { S.banner = "Kunde inte läsa listan över tentor i den här webbläsaren."; }
  render();
})();
})();
</script>
